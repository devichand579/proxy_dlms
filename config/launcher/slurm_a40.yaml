# @package _global_
# SLURM launcher 
# Use: launcher=slurm. Requires --multirun for multirun.


defaults:
  - override /hydra/launcher: submitit_slurm

hydra:
  launcher:
    submitit_folder: job_outputs/%j
    partition: gpupart_a40       
    qos: null              # set if required
    timeout_min: 2820       # 47 hours
    mem_gb: 64
    gres: gpu:1
    cpus_per_task: 8
    nodes: 1
    tasks_per_node: 1

    setup:
      - source $(conda info --base)/etc/profile.d/conda.sh
      - conda activate strace
