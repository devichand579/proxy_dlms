# @package _global_
# SLURM launcher 
# Use: launcher=slurm. Requires --multirun for multirun.


defaults:
  - override /hydra/launcher: submitit_slurm

hydra:
  launcher:
    submitit_folder: job_outputs/%j
    partition: dibdp    
    qos: null              # set if required
    timeout_min: 10080       # 7 days
    mem_gb: 38
    gres: gpu:1
    cpus_per_task: 8
    nodes: 1
    tasks_per_node: 1
