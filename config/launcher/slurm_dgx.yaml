# @package _global_
# SLURM launcher for DGX2
# Use: launcher=slurm_dgx. Requires --multirun for multirun sweeps.
# Parallel multi-GPU (one job, N slots): launcher=slurm_dgx parallel_runs_file=config/parallel_eval_runs.yaml
# Example: python launch_eval.py parallel_runs_file=config/parallel_eval_runs.yaml launcher=slurm_dgx offline=true

defaults:
  - override /hydra/launcher: submitit_slurm

hydra:
  launcher:
    submitit_folder: job_outputs/%j
    partition: dgx2
    qos: gpu2
    timeout_min: 4320   # 72h
    mem_gb: 128
    # gres set at submit time from parallel_runs_file slot count (gpus_per_node)
    cpus_per_task: 8
    nodes: 1
    tasks_per_node: 1
    signal_delay_s: 120
    # DGX-specific SBATCH options via additional_parameters
    additional_parameters:
      signal: "USR2@120"
      wckey: submitit
      open_mode: append

    setup:
      - source $(conda info --base)/etc/profile.d/conda.sh
      - conda activate strace
      # Activate these if you want complete offline running
      - export HF_DATASETS_OFFLINE=1
      - export TRANSFORMERS_OFFLINE=1
      - export WANDB_MODE=offline
      - export HF_HOME=$HOME/.cache/huggingface
      - export HF_DATASETS_CACHE=$HOME/.cache/huggingface/datasets
