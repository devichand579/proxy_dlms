# SLURM launcher 
# Use: launcher=slurm. Requires --multirun for multirun.


defaults:
  - override hydra/launcher: submitit_slurm

hydra:
  launcher:
    partition: dgx2
    qos: gpu2
    timeout_max: 4320   # 72h (override: hydra.launcher.timeout_max=N)
    mem_gb: 64
    gres: gpu:1
    cpus_per_task: 8
    nodes: 1
    ntasks: 1

  setup:
      - source $(conda info --base)/etc/profile.d/conda.sh
      - conda activate strace