# Hydra main config for launch_eval.py
# Override from CLI: task_name=gsm8k mode=pd batch_size=4
# Multirun (one job per combination): task_name=gsm8k,humaneval mode=pd,bd --multirun launcher=slurm
#
# Launchers: launcher=local | launcher=slurm_dgx | launcher=slurm_h100 | launcher=slurm_l40 | launcher=slurm_a40 | launcher=slurm_v100
# Override at runtime: hydra.launcher.partition=X hydra.launcher.mem_gb=N hydra.launcher.timeout_max=M ...

defaults:
  - launcher: local
  - _self_

# Eval parameters 
batch_size: 4
mode: pd
task_name: gsm8k
model: llada  # dirname under ./models/: llada | llada1_5 | dream
compile_model: false
# false = reference LLaDA-style: full diffusion steps, no truncate-at-first-EOS in chunk decode (see eval.LLaDAEvalHarness)
use_eos_harness: true
block_length: null  # null = use mode default (block_diffusion 32, fdm 64, dus 16, else gen_length). Set to int to override.
top_k: 2  # null = 1. Number of tokens to transfer per step (top_k scheduler only). Set to int to override.
wandb: true
tracing_enabled: true
num_fewshot: null  # null = use per-task default (humaneval 0, gsm8k 4, mbpp 3, arc_challenge_chat 0). Set to int to override.

# Optional intervention
intervention:
  mode: null
  steps: null
  k: 1

# Pre-logit hidden states (see cst/): saved as bfloat16 .pt per generate_until chunk
# When cst_checkpoint is set below, eval.py forces capture_pre_logits=true and a default hidden dir — no need to set capture here.
capture_pre_logits: false
hidden_capture_path: null  # null = auto (outputs/<run>/hidden, or <checkpoint_dir>/hidden if resumable)

# Optional CST metrics on each hidden chunk, *per lm-eval task* (task_name = one dataset).
# Implies PreLogitsCaptureWrapper + hidden writes (see eval.py). NTF uses the same loaded LM as the eval harness.
cst_checkpoint: null  # e.g. outputs/cst_ckpt/cst_llada_scheduler_pd_k4096_w4_train_best.pt
cst_config_path: null  # null = use config/cst.yaml ``cst:`` block for architecture
cst_ntf_conf_low: 0.2
cst_ntf_conf_high: 0.8
# NTF: if true, match argmax with EOS masked out (first non-EOS) on teacher and substitute; else raw top-1
cst_ntf_first_non_eos: false
# Buffer hiddens until this on-disk size, then CST eval + delete (same idea as training ``target_staging_gb``)
cst_target_staging_gb: 1.0

# Checkpointing: when true, use stable run_id (no timestamp)
resumable: false
run_id: null  # optional custom id; if null, uses {model}_{task}_{mode}

# Env / paths
wandb_project: strace

# Hydra: run in project root so outputs/ and trace_outputs/ are in same directory
hydra:
  run:
    dir: .
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.override_dirname}
