# Hydra main config for launch_eval.py
# Override from CLI: task_name=gsm8k mode=pd batch_size=4
# Multirun (one job per combination): task_name=gsm8k,humaneval mode=pd,bd --multirun launcher=slurm
#
# Launchers: launcher=local | launcher=slurm_dgx | launcher=slurm_h100 | launcher=slurm_l40 | launcher=slurm_a40 | launcher=slurm_v100
# Override at runtime: hydra.launcher.partition=X hydra.launcher.mem_gb=N hydra.launcher.timeout_max=M ...

defaults:
  - launcher: local
  - _self_

# Eval parameters 
batch_size: 4
mode: pd
task_name: gsm8k
model: llada
compile_model: false
block_length: null  # null = use mode default (block_diffusion 32, fdm 64, dus 16, else gen_length). Set to int to override.
top_k: 2  # null = 1. Number of tokens to transfer per step (top_k scheduler only). Set to int to override.
wandb: true
tracing_enabled: true
num_fewshot: null  # null = use per-task default (humaneval 0, gsm8k 4, mbpp 3, arc_challenge_chat 0). Set to int to override.

# Optional intervention
intervention:
  mode: null
  steps: null
  k: 1

# Env / paths
wandb_project: strace

# Hydra: run in project root so outputs/ and trace_outputs/ are in same directory
hydra:
  run:
    dir: .
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.override_dirname}
